name: Validate bot and Mini App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m py_compile main.py
      - name: Run logic tests
        env:
          BOT_TOKEN: "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
        run: pytest -q
      - name: Check Mini App JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("webapp/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/miniapp.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/miniapp.js
