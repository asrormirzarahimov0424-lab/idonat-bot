name: Validate bot and Mini App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m py_compile main.py
      - name: Run logic and Mini App contract tests
        env:
          BOT_TOKEN: "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
          ADMIN_ID: "0"
        run: pytest -q
      - name: Check every inline Mini App JavaScript block
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("webapp/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          for index, script in enumerate(scripts):
              Path(f"/tmp/miniapp-{index}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script blocks")
          PY
          for file in /tmp/miniapp-*.js; do node --check "$file"; done
